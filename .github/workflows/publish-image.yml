name: Publish Docker image

on:
  workflow_dispatch:
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Build and test without MAX access
        run: |
          docker build -t place-meeting-ci .
          docker run --rm --network none --entrypoint python place-meeting-ci -m pip check
          docker run --rm --network none --entrypoint python place-meeting-ci -m unittest discover -s tests -q
          MAX_BOT_TOKEN=offline-test MODERATOR_ACCESS_CODE=offline-test-code docker compose config --quiet
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested image
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          image="ghcr.io/${REPOSITORY,,}"
          docker tag place-meeting-ci "$image:dev"
          docker tag place-meeting-ci "$image:sha-$COMMIT_SHA"
          docker push "$image:sha-$COMMIT_SHA"
          docker push "$image:dev"
